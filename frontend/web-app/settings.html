<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Call My Pods - Settings</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#0d7ff2",
              "background-light": "#f5f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              display: ["Space Grotesk"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px"
            },
          },
        },
      };
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="flex min-h-screen flex-col">
<header class="sticky top-0 z-10 border-b border-gray-200/50 dark:border-gray-700/50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<div class="container mx-auto flex items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
<div class="flex items-center gap-2">
<h1 class="text-xl font-bold tracking-tighter text-gray-900 dark:text-white">Call My Pods</h1>
<span class="hidden sm:inline text-sm font-medium text-gray-500 dark:text-gray-400">— CMP BY DDC</span>
</div>
</div>
</header>
<main class="flex-grow">
<div class="container mx-auto max-w-lg px-4 py-8 sm:px-6 lg:px-8">
<h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white mb-8">Settings</h2>
<div class="space-y-4 rounded-lg bg-white/50 dark:bg-black/10 p-2 sm:p-4">
<div class="flex items-center justify-between rounded-lg bg-background-light dark:bg-background-dark p-4">
<label class="flex-1 cursor-pointer select-none text-base font-medium text-gray-800 dark:text-gray-200" for="dark-mode">Dark mode</label>
<div class="shrink-0">
<label class="relative inline-flex cursor-pointer items-center">
<input class="peer sr-only" id="dark-mode" type="checkbox"/>
<div class="peer h-6 w-11 rounded-full bg-gray-300 dark:bg-gray-700 after:absolute after:left-[2px] after:top-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-gray-300 after:bg-white after:transition-all after:content-[''] peer-checked:bg-primary peer-checked:after:translate-x-full peer-checked:after:border-white dark:border-gray-600"></div>
</label>
</div>
</div>
<div class="flex items-center justify-between rounded-lg bg-background-light dark:bg-background-dark p-4">
<label class="flex-1 cursor-pointer select-none text-base font-medium text-gray-800 dark:text-gray-200" for="push-notifications">Push notifications</label>
<div class="shrink-0">
<label class="relative inline-flex cursor-pointer items-center">
<input class="peer sr-only" id="push-notifications" type="checkbox"/>
<div class="peer h-6 w-11 rounded-full bg-gray-300 dark:bg-gray-700 after:absolute after:left-[2px] after:top-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-gray-300 after:bg-white after:transition-all after:content-[''] peer-checked:bg-primary peer-checked:after:translate-x-full peer-checked:after:border-white dark:border-gray-600"></div>
</label>
</div>
</div>
<button class="flex w-full items-center justify-between rounded-lg bg-background-light dark:bg-background-dark p-4 text-left transition-colors hover:bg-gray-100 dark:hover:bg-gray-800/50">
<span class="text-base font-medium text-gray-800 dark:text-gray-200">App language</span>
<div class="flex items-center gap-2">
<span class="text-base text-gray-500 dark:text-gray-400">English</span>
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500">chevron_right</span>
</div>
</button>
</div>
<div class="mt-8 space-y-4 rounded-lg bg-white/50 dark:bg-black/10 p-2 sm:p-4">
<button class="flex w-full items-center justify-between rounded-lg bg-background-light dark:bg-background-dark p-4 text-left transition-colors hover:bg-red-500/10 dark:hover:bg-red-500/20">
<span class="text-base font-medium text-red-600 dark:text-red-400">Logout</span>
<span class="material-symbols-outlined text-red-600 dark:text-red-400">logout</span>
</button>
</div>
<div class="mt-12 text-center">
<p class="text-sm text-gray-500 dark:text-gray-400">App version 1.0.0</p>
</div>
</div>
</main>
</div>


</body></html>
