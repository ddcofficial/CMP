<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<title>Call My Pods - Ride Summary</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Space+Grotesk:wght@400;500;700" onload="this.rel='stylesheet'" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0d7ff2",
            "background-light": "#f5f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Space Grotesk"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="relative flex min-h-screen w-full flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-gray-200/50 dark:border-gray-700/50 px-10 py-4">
<div class="flex items-center gap-2">
<h1 class="text-xl font-bold text-gray-900 dark:text-white">
          Call My Pods
          <span class="font-normal text-gray-500 dark:text-gray-400">— CMP BY DDC</span>
</h1>
</div>
</header>
<main class="flex flex-1 items-center justify-center py-10">
<div class="w-full max-w-md space-y-8 p-4">
<div class="text-center">
<h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Ride Summary</h2>
<p class="mt-2 text-sm text-gray-600 dark:text-gray-400">Payment confirmed. Thank you for riding with us!</p>
</div>
<div class="grid grid-cols-3 gap-4 text-center">
<div class="rounded-lg bg-white/5 dark:bg-black/10 p-4 ring-1 ring-inset ring-gray-200/50 dark:ring-gray-700/50">
<p class="text-sm font-medium text-gray-500 dark:text-gray-400">Distance</p>
<p class="mt-1 text-2xl font-bold text-gray-900 dark:text-white">12.5 mi</p>
</div>
<div class="rounded-lg bg-white/5 dark:bg-black/10 p-4 ring-1 ring-inset ring-gray-200/50 dark:ring-gray-700/50">
<p class="text-sm font-medium text-gray-500 dark:text-gray-400">Time</p>
<p class="mt-1 text-2xl font-bold text-gray-900 dark:text-white">25 min</p>
</div>
<div class="rounded-lg bg-white/5 dark:bg-black/10 p-4 ring-1 ring-inset ring-gray-200/50 dark:ring-gray-700/50">
<p class="text-sm font-medium text-gray-500 dark:text-gray-400">Fare</p>
<p class="mt-1 text-2xl font-bold text-gray-900 dark:text-white">$22.50</p>
</div>
</div>
<div class="flex flex-col space-y-4 pt-4">
<button class="flex w-full items-center justify-center rounded-lg bg-primary px-5 py-3 text-base font-bold text-white transition-opacity hover:opacity-90">
            Rate Ride
          </button>
<button class="flex w-full items-center justify-center rounded-lg bg-primary/20 dark:bg-primary/30 px-5 py-3 text-base font-bold text-primary transition-opacity hover:opacity-90">
            Report Issue
          </button>
</div>
</div>
</main>
</div>

</body></html>
