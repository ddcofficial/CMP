            </button>

<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden" id="confirmation-modal">
<div class="w-full max-w-sm rounded-xl bg-background-light dark:bg-background-dark p-6 text-center shadow-2xl">
<div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-primary/10 text-primary mb-4">

</div>
<h3 class="text-xl font-bold text-gray-900 dark:text-white">Changes Saved</h3>
<p class="mt-2 text-gray-600 dark:text-gray-400">Your payment methods have been updated successfully.</p>
<button class="mt-6 w-full rounded-lg bg-primary h-11 px-5 text-base font-semibold text-white hover:bg-primary/90 transition-all" id="close-modal-button">
          Done
        </button>
</div>
</div>
</div>
<script>
    const confirmButton = document.getElementById('confirm-button');
    const modal = document.getElementById('confirmation-modal');
    const closeModalButton = document.getElementById('close-modal-button');
    confirmButton.addEventListener('click', () => {
      modal.classList.remove('hidden');
    });
    closeModalButton.addEventListener('click', () => {
      modal.classList.add('hidden');
    });
    window.addEventListener('click', (event) => {
        if (event.target === modal) {
            modal.classList.add('hidden');
        }
    });
  </script>
