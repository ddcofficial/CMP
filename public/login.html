<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Call My Pods - Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#0d7ff2",
              "background-light": "#f5f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              display: ["Space Grotesk"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
<style>
      .form-input::placeholder {
        color: #a0aec0;}
      .dark .form-input::placeholder {
        color: #718096;}
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#333333] dark:text-[#f0f0f0]">
<div class="flex flex-col min-h-screen">
<header class="w-full px-6 py-4 border-b border-background-light/80 dark:border-background-dark/80 bg-background-light dark:bg-background-dark shadow-sm">
<div class="max-w-7xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-3">
<svg class="h-8 w-8 text-primary" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path>
</svg>
<h1 class="text-xl font-bold text-[#1a202c] dark:text-white">Call My Pods</h1>
</div>
<div class="text-sm font-semibold text-[#4a5568] dark:text-[#a0aec0]">CMP BY DDC</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">
<div class="w-full max-w-md bg-white dark:bg-[#182533] rounded-xl shadow-lg p-8 space-y-6">
<div class="text-center">
<h2 class="text-3xl font-bold text-[#1a202c] dark:text-white">Welcome Back</h2>
<p class="mt-2 text-sm text-[#718096] dark:text-[#a0aec0]">Login or sign up to continue</p>
</div>
<div class="flex bg-background-light/80 dark:bg-background-dark/80 rounded-lg p-1">
<button class="w-1/2 py-2 text-sm font-medium rounded bg-primary text-white">Log In</button>
<button class="w-1/2 py-2 text-sm font-medium text-[#4a5568] dark:text-[#a0aec0] rounded">Sign Up</button>
</div>
<form class="space-y-4">
<div>
<label class="sr-only" for="email">Email</label>
<input autocomplete="email" class="form-input w-full px-4 py-3 rounded-lg bg-background-light dark:bg-background-dark border-transparent focus:ring-2 focus:ring-primary focus:border-transparent text-[#1a202c] dark:text-white" id="email" name="email" placeholder="Email Address" required="" type="email"/>
</div>
<div>
<label class="sr-only" for="password">Password</label>
<input autocomplete="current-password" class="form-input w-full px-4 py-3 rounded-lg bg-background-light dark:bg-background-dark border-transparent focus:ring-2 focus:ring-primary focus:border-transparent text-[#1a202c] dark:text-white" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<div class="text-right">
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                Log In
              </button>
</div>
</form>
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-[#d1d5db] dark:border-[#4a5568]"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-white dark:bg-[#182533] text-[#718096] dark:text-[#a0aec0]">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
<button class="w-full inline-flex justify-center py-3 px-4 border border-[#d1d5db] dark:border-[#4a5568] rounded-lg shadow-sm bg-white dark:bg-background-dark/80 text-sm font-medium text-[#4a5568] dark:text-white hover:bg-background-light/50 dark:hover:bg-background-dark">
              Continue with Vendor
            </button>
<button class="w-full inline-flex justify-center py-3 px-4 border border-[#d1d5db] dark:border-[#4a5568] rounded-lg shadow-sm bg-white dark:bg-background-dark/80 text-sm font-medium text-[#4a5568] dark:text-white hover:bg-background-light/50 dark:hover:bg-background-dark">
              Continue with SearchCo
            </button>
</div>
</div>
</main>
</div>
<script src="/js/auth.js"></script>
</body></html>
