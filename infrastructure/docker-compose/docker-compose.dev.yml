version: '3.8'

services:
  # --- Backend Services ---
  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ../../services/auth-service:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    env_file:
      - ../../.env
    depends_on:
      - mongodb

  pod-service:
    build:
      context: ../../services/pod-service
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ../../services/pod-service:/app
      - /app/node_modules
    ports:
      - "3002:3002"
    env_file:
      - ../../.env
    depends_on:
      - mongodb
      - redis

  # --- Databases ---
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data: